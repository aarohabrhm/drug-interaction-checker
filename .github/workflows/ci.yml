name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest

    # Run against Postgres, not the SQLite dev fallback -- CI should exercise
    # the engine production uses, or Postgres-only issues surface on deploy.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: safemeds_test
          POSTGRES_USER: safemeds
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway, and long/varied enough to satisfy security.W009 so the
      # deploy check below runs at --fail-level WARNING. Not a real secret and
      # not used anywhere outside this ephemeral CI job.
      DJANGO_SECRET_KEY: ci-only-4f8b2d7e9a1c6035b8e4d2f7a9c1e63b5d0a8f2c7e94b1d6
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      DATABASE_URL: postgres://safemeds:ci-only-password@localhost:5432/safemeds_test
      # External lookups are disabled during tests anyway; set explicitly so CI
      # can never depend on RxNorm or openFDA being reachable.
      RXNORM_ENABLED: "false"
      OPENFDA_ENABLED: "false"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for missing migrations
        # Fails if a model was changed without generating a migration.
        run: python manage.py makemigrations --check --dry-run

      - name: Django deployment checks
        # Runs with DEBUG=false, so this asserts the production security
        # posture (HSTS, secure cookies, SSL redirect, ALLOWED_HOSTS).
        run: python manage.py check --deploy --fail-level WARNING

      - name: Run tests
        run: python manage.py test --verbosity 2

      - name: Validate OpenAPI schema
        # --fail-on-warn keeps the schema honest: an endpoint added without
        # annotation breaks the build rather than silently degrading the docs.
        run: python manage.py spectacular --file schema.yml --fail-on-warn

      - name: Upload OpenAPI schema
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: backend/schema.yml

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: project

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: project/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          # Required at build time; the build fails without it by design.
          VITE_API_BASE_URL: https://api.example.com
        run: npm run build

  container:
    name: Container smoke test
    runs-on: ubuntu-latest

    # The jobs above never build the image or start a container, so nothing
    # verified how the app behaves when actually deployed. Every deployment
    # failure this project has had lived in that gap: a healthcheck on the wrong
    # port, probes rejected by rate limiting, probes rejected by ALLOWED_HOSTS.
    # None were reachable from a Django test; all are reachable from here.
    #
    # Conditions mirror a real platform rather than a convenient local setup:
    # a non-default $PORT, DEBUG off, and the SSL redirect enabled.

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: safemeds_smoke
          POSTGRES_USER: safemeds
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Platforms assign a port; Render uses 10000. Using the default here
      # would hide exactly the mismatch that broke a deploy.
      APP_PORT: "10000"
      APP_HOST: safemeds-api.onrender.com

    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t safemeds-api:ci ./backend

      - name: Start the container
        run: |
          docker run -d --name safemeds --network host \
            -e PORT="$APP_PORT" \
            -e DJANGO_DEBUG=false \
            -e DJANGO_SECRET_KEY=ci-only-4f8b2d7e9a1c6035b8e4d2f7a9c1e63b5d0a8f2c7e94b1d6 \
            -e DJANGO_ALLOWED_HOSTS="$APP_HOST" \
            -e DATABASE_URL=postgres://safemeds:ci-only-password@localhost:5432/safemeds_smoke \
            -e CORS_ALLOWED_ORIGINS=https://safemeds-web.onrender.com \
            -e RXNORM_ENABLED=false \
            -e OPENFDA_ENABLED=false \
            safemeds-api:ci

      - name: Wait for the app to serve
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -H "Host: $APP_HOST" "http://localhost:$APP_PORT/healthz" >/dev/null 2>&1; then
              echo "serving after ${i}s"; exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' safemeds)" != "true" ]; then
              echo "::error::container exited before serving"; docker logs safemeds; exit 1
            fi
            sleep 1
          done
          echo "::error::timed out waiting for the app"; docker logs safemeds; exit 1

      - name: Entrypoint ran migrations
        # The image runs migrate itself; a deploy against an empty database
        # depends on it.
        run: docker logs safemeds 2>&1 | grep -q "Applying database migrations"

      - name: Probes answer on the assigned port
        run: |
          curl -fsS -H "Host: $APP_HOST" "http://localhost:$APP_PORT/healthz" | grep -q '"ok"'
          curl -fsS -H "Host: $APP_HOST" "http://localhost:$APP_PORT/readyz"  | grep -q '"database": *"ok"'

      - name: Probes survive sustained polling
        # A platform polls far above the anonymous rate limit. Throttled probes
        # made a healthy service look unhealthy and failed the deploy.
        run: |
          for i in $(seq 1 80); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Host: $APP_HOST" "http://localhost:$APP_PORT/healthz")
            if [ "$code" != "200" ]; then
              echo "::error::probe $i returned $code (rate limited?)"; exit 1
            fi
          done

      - name: Docker's own healthcheck reports healthy
        # It probes $PORT from inside the container, so this covers two things
        # an external request cannot: that the port is the one gunicorn bound,
        # and that a loopback Host is accepted. A container rejected by its own
        # probe is marked unhealthy while every external request still works.
        #
        # The window allows for the 20s start period plus a 30s interval, so it
        # must comfortably exceed 50s.
        run: |
          for i in $(seq 1 120); do
            s=$(docker inspect -f '{{.State.Health.Status}}' safemeds 2>/dev/null || echo none)
            case "$s" in
              healthy) echo "healthy after ${i}s"; exit 0 ;;
              unhealthy) echo "::error::container reported unhealthy"; docker logs safemeds; exit 1 ;;
            esac
            sleep 1
          done
          echo "::error::healthcheck never became healthy"; docker inspect -f '{{json .State.Health}}' safemeds; exit 1

      - name: An unknown Host is still rejected
        # Guards the ALLOWED_HOSTS fix against becoming a wildcard.
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Host: evil.example.com" "http://localhost:$APP_PORT/healthz")
          [ "$code" = "400" ] || { echo "::error::expected 400, got $code"; exit 1; }

      - name: Container logs
        if: always()
        run: docker logs safemeds 2>&1 | tail -40

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Advisory: new CVEs are published constantly and should not turn every
    # unrelated PR red. Read the output, do not ignore it.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python dependency audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt

      - name: npm audit
        working-directory: project
        run: npm audit --audit-level=high
