# Local full-stack environment.
#
# Not a production deployment: it runs a database in a container and reads
# secrets from backend/.env. For production, build the same images and supply
# configuration through your platform's secret store.
#
#   cp backend/.env.example backend/.env   # then fill it in
#   docker compose up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: drug_checker
      POSTGRES_USER: safemeds
      # Local-only credential. Compose reads it from your shell or a root .env
      # file; there is no default, so this fails loudly rather than shipping a
      # well-known password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your environment}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safemeds -d drug_checker"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host by default -- only the backend needs it.
    expose:
      - "5432"

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://safemeds:${POSTGRES_PASSWORD}@db:5432/drug_checker
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Give gunicorn time to drain in-flight requests on `docker compose down`.
    stop_grace_period: 40s

  frontend:
    build:
      context: ./project
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
