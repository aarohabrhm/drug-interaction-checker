<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The asset is a PNG; it was declared as SVG, which some browsers reject
         outright and fall back to the default icon for. -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Screen new prescriptions against a patient's current medications, graded by clinical severity."
    />
    <!-- Inter, with the system stack as the fallback so the app is still
         legible before the font lands or if it never does. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>SafeMeds</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
