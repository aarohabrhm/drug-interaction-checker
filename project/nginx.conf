server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version.
    server_tokens off;

    # Baseline security headers. HSTS is intentionally NOT set here -- it
    # belongs on the TLS-terminating layer in front of this container.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite emits content-hashed filenames, so assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any unknown path is a client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or clients pin to a stale bundle.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
