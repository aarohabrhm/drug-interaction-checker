# Render Blueprint for SafeMeds.
#
# Deploy: push this file, then in the Render dashboard choose
# "New +" -> "Blueprint" and point it at this repository.
#
# The two services need each other's URL, and both are wired automatically from
# the real hostnames Render assigns -- so nothing has to be typed in, and it
# stays correct even when Render appends a suffix to a service name that is
# already taken globally.
#
# The only prompt is GEMINI_API_KEY, which is optional: leave it blank and the
# app resolves interactions from the curated dataset and openFDA, logs a single
# warning, and runs normally.

databases:
  - name: safemeds-db
    plan: free
    databaseName: drug_checker
    user: safemeds
    # Must match the API's region. `fromDatabase` supplies the *internal*
    # connection string, which is only reachable from the same region -- a
    # mismatch leaves the API unable to reach the database at all.
    region: oregon

services:
  # ------------------------------------------------------------------ backend
  - type: web
    name: safemeds-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Migrations run in the image's entrypoint, so no release command is
    # needed -- which also keeps this working on the free tier, where Render's
    # preDeployCommand is unavailable.
    healthCheckPath: /healthz
    envVars:
      # Generated by Render and never seen by anyone. This is what replaces the
      # key that leaked into git history -- do not paste the old one back in.
      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: safemeds-db
          property: connectionString

      - key: DJANGO_DEBUG
        value: "false"

      # Render exposes the service's own hostname, which is exactly the format
      # ALLOWED_HOSTS wants (no scheme).
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: safemeds-api
          property: host

      # Both are derived from the frontend's real hostname rather than typed in.
      # `fromService` yields a bare host with no scheme; settings.py reads a
      # scheme-less origin as https, which is the only scheme this is served
      # over in production.
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: safemeds-web
          property: host
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        fromService:
          type: web
          name: safemeds-web
          property: host

      # TLS terminates at Render's proxy, which sets X-Forwarded-Proto.
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "31536000"

      # Free tier has 512MB and shares a CPU; the default worker formula would
      # start too many for that. Threads keep a worker useful while an
      # interaction lookup waits on RxNorm or openFDA.
      - key: WEB_CONCURRENCY
        value: "2"
      - key: GUNICORN_THREADS
        value: "4"

      - key: RXNORM_ENABLED
        value: "true"
      - key: OPENFDA_ENABLED
        value: "true"

      # Optional. Leave unset and the app uses the curated dataset plus
      # openFDA, logs one warning, and does not crash.
      - key: GEMINI_API_KEY
        sync: false

      - key: AUTH_TOKEN_TTL_HOURS
        value: "12"
      - key: DJANGO_LOG_LEVEL
        value: "INFO"

  # ----------------------------------------------------------------- frontend
  - type: web
    name: safemeds-web
    runtime: static
    # VITE_API_BASE_URL is inlined into the bundle at BUILD time, so changing it
    # needs a rebuild rather than a restart, and the build fails outright if it
    # is missing. Rather than asking for it by hand -- which is easy to skip,
    # and easy to get wrong when Render appends a suffix to a taken service
    # name -- it is derived here from the API's real hostname. `fromService`
    # yields a bare host with no scheme, so the scheme is added here.
    buildCommand: >-
      cd project && npm ci &&
      VITE_API_BASE_URL="https://$SAFEMEDS_API_HOST" npm run build
    staticPublishPath: ./project/dist
    envVars:
      - key: SAFEMEDS_API_HOST
        fromService:
          type: web
          name: safemeds-api
          property: host
    routes:
      # Single-page app: every unmatched path must serve index.html or a deep
      # link like /dashboard 404s on refresh.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
