# Render Blueprint for SafeMeds.
#
# Deploy: push this file, then in the Render dashboard choose
# "New +" -> "Blueprint" and point it at this repository.
#
# Render prompts for three values on the first deploy, because each service
# needs an address that does not exist until the services do:
#
#   safemeds-api  CORS_ALLOWED_ORIGINS         -> the frontend's full URL
#   safemeds-api  DJANGO_CSRF_TRUSTED_ORIGINS  -> the same
#   safemeds-web  VITE_API_BASE_URL            -> the API's full URL
#
# Use the **full hostname**, e.g. https://safemeds-api.onrender.com -- not the
# service name. Render appends a suffix when a name is already taken globally
# (safemeds-web may become safemeds-web-a1b2), so take the URLs from the
# dashboard once the services exist rather than assuming the names below.
#
# These are not derived via `fromService`: it supplies the service *name*, not
# its hostname, which yields addresses with no domain. Neither failure stops a
# deploy -- both surface only as requests failing in the browser while every
# server-side log and health check looks perfectly healthy.
#
# GEMINI_API_KEY is also prompted and is optional: leave it blank and the app
# resolves interactions from the curated dataset and openFDA.

databases:
  - name: safemeds-db
    plan: free
    databaseName: drug_checker
    user: safemeds
    # Must match the API's region. `fromDatabase` supplies the *internal*
    # connection string, which is only reachable from the same region -- a
    # mismatch leaves the API unable to reach the database at all.
    region: oregon

services:
  # ------------------------------------------------------------------ backend
  - type: web
    name: safemeds-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Migrations run in the image's entrypoint, so no release command is
    # needed -- which also keeps this working on the free tier, where Render's
    # preDeployCommand is unavailable.
    healthCheckPath: /healthz
    envVars:
      # Generated by Render and never seen by anyone. This is what replaces the
      # key that leaked into git history -- do not paste the old one back in.
      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: safemeds-db
          property: connectionString

      - key: DJANGO_DEBUG
        value: "false"

      # DJANGO_ALLOWED_HOSTS is deliberately not set here. A service cannot
      # reference itself through `fromService`, and settings.py already trusts
      # RENDER_EXTERNAL_HOSTNAME, which Render injects with the real public
      # hostname including any suffix it added. Set this only to serve an
      # additional custom domain.

      # Set these to the frontend's address once it exists. `fromService` does
      # not populate them reliably for a static site, and an empty value is
      # near-undiagnosable: the browser blocks the request before it reaches
      # the server, so the API stays healthy in every log and probe while the
      # frontend reports that requests failed. Prompting is worth the extra step.
      #
      # Either form works -- settings.py reads a scheme-less value as https:
      #   safemeds-web.onrender.com
      #   https://safemeds-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false

      # TLS terminates at Render's proxy, which sets X-Forwarded-Proto.
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "31536000"

      # Free tier has 512MB and shares a CPU; the default worker formula would
      # start too many for that. Threads keep a worker useful while an
      # interaction lookup waits on RxNorm or openFDA.
      - key: WEB_CONCURRENCY
        value: "2"
      - key: GUNICORN_THREADS
        value: "4"

      - key: RXNORM_ENABLED
        value: "true"
      - key: OPENFDA_ENABLED
        value: "true"

      # Optional. Leave unset and the app uses the curated dataset plus
      # openFDA, logs one warning, and does not crash.
      - key: GEMINI_API_KEY
        sync: false

      - key: AUTH_TOKEN_TTL_HOURS
        value: "12"
      - key: DJANGO_LOG_LEVEL
        value: "INFO"

  # ----------------------------------------------------------------- frontend
  - type: web
    name: safemeds-web
    runtime: static
    buildCommand: cd project && npm ci && npm run build
    staticPublishPath: ./project/dist
    envVars:
      # The API's full address, e.g. https://safemeds-api.onrender.com
      #
      # Asked for rather than derived: `fromService` supplies the service *name*
      # ("safemeds-api"), not its hostname, so deriving it produced a URL with
      # no domain -- which the build accepts and every request then fails
      # against, in the browser, where the server never sees it.
      #
      # Inlined into the bundle at BUILD time, so changing it needs a rebuild
      # with the cache cleared, not a restart. The build fails outright if it is
      # missing, which is deliberate: the alternative is a bundle silently
      # pointing at localhost.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # Single-page app: every unmatched path must serve index.html or a deep
      # link like /dashboard 404s on refresh.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
