# Render Blueprint for SafeMeds.
#
# Deploy: push this file, then in the Render dashboard choose
# "New +" -> "Blueprint" and point it at this repository.
#
# Two values cannot be wired automatically, because each service needs the
# other's public URL and Render only exposes a bare hostname (no scheme) to
# `fromService`. They are marked `sync: false`, so Render prompts for them on
# the first deploy. Set them once the URLs are known:
#
#   safemeds-api  CORS_ALLOWED_ORIGINS   -> https://safemeds-web.onrender.com
#   safemeds-web  VITE_API_BASE_URL      -> https://safemeds-api.onrender.com
#
# Render appends a suffix if a service name is already taken globally, so copy
# the real URLs from the dashboard rather than assuming the names above.

databases:
  - name: safemeds-db
    plan: free
    databaseName: drug_checker
    user: safemeds

services:
  # ------------------------------------------------------------------ backend
  - type: web
    name: safemeds-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Migrations run in the image's entrypoint, so no release command is
    # needed -- which also keeps this working on the free tier, where Render's
    # preDeployCommand is unavailable.
    healthCheckPath: /healthz
    envVars:
      # Generated by Render and never seen by anyone. This is what replaces the
      # key that leaked into git history -- do not paste the old one back in.
      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: safemeds-db
          property: connectionString

      - key: DJANGO_DEBUG
        value: "false"

      # Render exposes the service's own hostname, which is exactly the format
      # ALLOWED_HOSTS wants (no scheme).
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: safemeds-api
          property: host

      # Absolute origins with scheme; see the note at the top.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false

      # TLS terminates at Render's proxy, which sets X-Forwarded-Proto.
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "31536000"

      # Free tier has 512MB and shares a CPU; the default worker formula would
      # start too many for that. Threads keep a worker useful while an
      # interaction lookup waits on RxNorm or openFDA.
      - key: WEB_CONCURRENCY
        value: "2"
      - key: GUNICORN_THREADS
        value: "4"

      - key: RXNORM_ENABLED
        value: "true"
      - key: OPENFDA_ENABLED
        value: "true"

      # Optional. Leave unset and the app uses the curated dataset plus
      # openFDA, logs one warning, and does not crash.
      - key: GEMINI_API_KEY
        sync: false

      - key: AUTH_TOKEN_TTL_HOURS
        value: "12"
      - key: DJANGO_LOG_LEVEL
        value: "INFO"

  # ----------------------------------------------------------------- frontend
  - type: web
    name: safemeds-web
    runtime: static
    buildCommand: cd project && npm ci && npm run build
    staticPublishPath: ./project/dist
    envVars:
      # Inlined into the bundle at BUILD time, so changing it needs a rebuild,
      # not just a restart. The build fails outright if it is missing.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # Single-page app: every unmatched path must serve index.html or a deep
      # link like /dashboard 404s on refresh.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
